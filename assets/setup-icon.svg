<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The Catalyst Setup mark. Same family as the other four: a near-black rounded square, one
       crimson glyph, and (as in Catalyst Link) a pale second stroke. An arrow coming to rest in a
       tray: something being put in its place. Colours are the identity's ground, signal and ink. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191a20"/>
      <stop offset=".55" stop-color="#101116"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#ground)" stroke="#23252b" stroke-width="6"/>
  <path d="M148 300 v52 a28 28 0 0 0 28 28 h160 a28 28 0 0 0 28 -28 v-52" fill="none" stroke="#e8e9ec" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M256 124 v168 M188 232 l68 68 l68 -68" fill="none" stroke="#e94560" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
